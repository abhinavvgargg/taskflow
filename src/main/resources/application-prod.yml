spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

# No hibernate logging in PROD
logging:
  structured:
    format:
      console: ecs

taskflow:
  app:
    frontend-base-url: ${FRONTEND_BASE_URL}