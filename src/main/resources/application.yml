spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    clean-disabled: true

  application:
    name: taskflow

  profiles:
    active: dev

taskflow:
  api:
    default-page-size: 20
    max-page-size: 100

server:
  error:
    include-stacktrace: never
    include-message: never