spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    clean-disabled: true
  application:
    name: taskflow
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s

taskflow:
  api:
    default-page-size: 20
    max-page-size: 100
  security:
    tokens:
      email-verification-ttl: 24h
      password-reset-ttl: 30m
    lockout:
      max-failed-attempts: 5
      duration: 15m
    jwt:
      issuer: taskflow
      audience: taskflow-api
      access-token-ttl: 15m
      clock-skew: 5s
      key-id:
      private-key:
      public-key:
    sessions:
      refresh-token-idle-ttl: 14d
      absolute-ttl: 30d
      reuse-grace: 10s
      cookie:
        name: taskflow_refresh
        path: /api/v1/auth
        same-site: strict

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: ADMIN   # without this, "authorized" means ANY authenticated user, including self-registered ones
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: simple